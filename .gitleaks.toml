# gitleaks 配置:在默认规则之上追加本项目已知的凭据形态。CI(.github/workflows/secret-scan.yml)与本地钩子共用。
title = "scada-deploy-tool"

[extend]
useDefault = true

[[rules]]
id = "project-known-passwords"
description = "本项目环境的已知密码 / 账号字面量"
regex = '''tenant&2028|GridopsReport#|report@gridops\.local'''
keywords = ["tenant&2028", "GridopsReport", "gridops.local"]

[[rules]]
id = "tb-jwt"
description = "ThingsBoard JWT"
regex = '''eyJ[A-Za-z0-9_-]{15,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''

[[rules]]
id = "url-embedded-credentials"
description = "URL 内嵌用户名密码"
regex = '''[a-z][a-z0-9+.-]*://[^/\s:@'"<>]+:[^/\s@'"<>]{3,}@[A-Za-z0-9.-]+'''

[allowlist]
description = "占位符与示例"
regexes = [
  '''<password>''',
  '''<token>''',
  '''changeme''',
  '''\$\{?[A-Z_]+\}?''',
]
paths = [
  '''\.gitleaks\.toml$''',
  '''\.githooks/pre-commit$''',
  '''CONTRIBUTING\.md$''',
  # 站点声明 / 页面配置的测试样本:其中 "key": "revenue5mCostDaily" 这类字段是 TB 遥测 key 名,不是密钥。
  # 默认规则 generic-api-key 按熵值误报(2026-09-03 提交 94fd554 的 secret-scan 因此失败)。样本文件本身不含凭据。
  '''packages/compiler/test/fixtures/.*\.tbsite\.json$''',
  '''packages/renderer/test/fixtures/.*\.json$''',
  '''docs/联调记录/.*\.pageconfig\.json$''',
]
